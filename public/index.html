<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Nations Map</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(239, 68, 68, 0.15), transparent 25%);
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        .header {
            text-align: center;
        }

        .header h1 {
            margin: 0 0 0.5rem 0;
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            margin: 0;
            color: #94a3b8;
            font-size: 0.95rem;
        }

        .map-container {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 2rem;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        .nation {
            fill: #334155;
            stroke: var(--bg-color);
            stroke-width: 2;
            cursor: pointer;
            transition: var(--transition);
            transform-origin: center;
        }

        .nation:hover {
            opacity: 0.8;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.2));
        }

        .legend {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            justify-content: center;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: #cbd5e1;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            transition: var(--transition);
        }

        .controls {
            display: flex;
            gap: 1rem;
            width: 100%;
            justify-content: space-between;
            align-items: center;
        }

        .status {
            font-size: 0.9rem;
            color: #94a3b8;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.3);
        }

        button:active {
            transform: translateY(0);
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Territory Tracker</h1>
            <p>Click a region to cycle through its states. Click count determines the color.</p>
        </div>

        <div class="map-container">
            <!-- Sample Map SVG (Stylized abstract regions, replace with your actual SVG map) -->
            <svg viewBox="0 0 400 300" width="100%" height="300" id="world-map">
                <!-- Ensure your paths/polygons have the class "nation" and a unique ID -->
                <path id="nation-1" class="nation" d="M50,150 Q80,100 150,120 T250,80 T350,150 T280,250 T120,220 Z" />
                <path id="nation-2" class="nation" d="M10,50 Q40,20 100,60 T180,30 T220,100 T120,120 Z" />
                <path id="nation-3" class="nation" d="M250,50 Q280,10 330,40 T380,80 T300,120 Z" />
                <path id="nation-4" class="nation" d="M50,200 Q20,250 80,280 T180,270 T150,220 Z" />
            </svg>
        </div>

        <div class="legend" id="legend">
            <!-- Populated by JS -->
        </div>

        <div class="controls">
            <div class="status" id="status">No clicks recorded yet.</div>
            <button id="save-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                    <polyline points="17 21 17 13 7 13 7 21"></polyline>
                    <polyline points="7 3 7 8 15 8"></polyline>
                </svg>
                Save State
            </button>
        </div>
    </div>

    <script>
        // Define our color sequence based on clicks
        const COLOR_STATES = [
            { clicks: 0, color: '#334155', label: '0 Clicks (Default)' },
            { clicks: 1, color: '#ef4444', label: '1 Click (Red)' },
            { clicks: 2, color: '#3b82f6', label: '2 Clicks (Blue)' },
            { clicks: 3, color: '#10b981', label: '3 Clicks (Green)' },
            { clicks: 4, color: '#f59e0b', label: '4 Clicks (Yellow)' },
            { clicks: 5, color: '#8b5cf6', label: '5 Clicks (Purple)' }
        ];

        // Store the state for each nation
        const nationStates = {};

        // Initialize UI
        function init() {
            renderLegend();
            
            const nations = document.querySelectorAll('.nation');
            nations.forEach(nation => {
                // Initialize state
                nationStates[nation.id] = 0;
                
                // Add click listener
                nation.addEventListener('click', () => {
                    handleNationClick(nation);
                });
            });

            // Save button listener
            document.getElementById('save-btn').addEventListener('click', saveState);
        }

        // Handle clicking a nation
        function handleNationClick(nationEl) {
            const id = nationEl.id;
            
            // Increment clicks, cycle back to 0 if it exceeds our max defined states
            nationStates[id] = (nationStates[id] + 1) % COLOR_STATES.length;
            
            // Update visual color
            const state = COLOR_STATES[nationStates[id]];
            nationEl.style.fill = state.color;

            // Micro-animation for visual feedback
            nationEl.animate([
                { transform: 'scale(1)', filter: 'brightness(1)' },
                { transform: 'scale(1.02)', filter: 'brightness(1.5)' },
                { transform: 'scale(1)', filter: 'brightness(1)' }
            ], {
                duration: 300,
                easing: 'ease-out'
            });

            updateStatus(`Updated ${id} to ${nationStates[id]} clicks`);
        }

        // Render the color legend
        function renderLegend() {
            const legendEl = document.getElementById('legend');
            COLOR_STATES.forEach(state => {
                const item = document.createElement('div');
                item.className = 'legend-item';
                item.innerHTML = `
                    <div class="legend-color" style="background-color: ${state.color}"></div>
                    <span>${state.label}</span>
                `;
                legendEl.appendChild(item);
            });
        }

        // Update status text
        function updateStatus(msg) {
            document.getElementById('status').innerText = msg;
        }

        // Handle save
        function saveState() {
            // Converts the state object to JSON and triggers a file download
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(nationStates, null, 2));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", "nation_clicks.json");
            document.body.appendChild(dlAnchorElem);
            dlAnchorElem.click();
            document.body.removeChild(dlAnchorElem);
            
            updateStatus('State saved to nation_clicks.json!');
            
            // Add a visual flash to the button to indicate success
            const btn = document.getElementById('save-btn');
            const originalBg = btn.style.background;
            btn.style.background = '#10b981';
            btn.innerHTML = `
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
                Saved!
            `;
            setTimeout(() => {
                btn.style.background = originalBg;
                btn.innerHTML = `
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                        <polyline points="17 21 17 13 7 13 7 21"></polyline>
                        <polyline points="7 3 7 8 15 8"></polyline>
                    </svg>
                    Save State
                `;
            }, 2000);
        }

        // Run on load
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
